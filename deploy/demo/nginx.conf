# The demo stand online (ADR 0029): /etc/nginx/sites-available/court-monitor-demo.
# certbot adds the HTTPS server block and the redirect: `certbot --nginx -d <host>`.
server {
    listen 80;
    listen [::]:80;
    server_name court-monitor-demo.duckdns.org;

    # The copy holds real names: no search engine is to index or follow it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
