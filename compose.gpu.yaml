# GPU override: semantic indexing on the NVIDIA card.
#
# Host prerequisite (Arch Linux), once:
#   sudo pacman -S nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
#
# Use it with every compose command, or put it in .env:
#   COMPOSE_FILE=compose.yaml:compose.gpu.yaml
#   docker compose --profile production build
#   docker compose --profile production up -d
#
x-gpu-build: &gpu-build
  context: .
  args:
    INSTALL_SEMANTIC: "1"

x-gpu-device: &gpu-device
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

x-semantic-environment: &semantic-environment
  # The embedding model is downloaded once into the hf_cache volume.
  HF_HOME: /opt/hf_cache

services:
  migrate:
    build: *gpu-build

  api:
    build: *gpu-build
    deploy: *gpu-device
    environment:
      <<: *semantic-environment
    volumes:
      - hf_cache:/opt/hf_cache

  # Builds the image the daemon runs; the webserver itself never extracts.
  dagster-webserver:
    build: *gpu-build

  dagster-daemon:
    deploy: *gpu-device
    environment:
      <<: *semantic-environment
    volumes:
      - hf_cache:/opt/hf_cache

volumes:
  hf_cache:
