# Alembic configuration. The actual DB URL is injected from court_monitor settings
# in migrations/env.py (env var CM_DATABASE_URL / .env). This file only sets
# script location and generic options.

[alembic]
script_location = migrations
prepend_sys_path = src
# timezone is UTC; ISO timestamps in the version table
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
