# The demo stand (ADR 0029): a copy of the production database, read-only, with no
# model, no Telegram search and no Dagster. Its own compose project, image, volume and
# port, so nothing here touches the production containers on the same server.
#
#   cp deploy/demo/env.example .env.demo   # and set POSTGRES_PASSWORD
#   docker compose -p court-monitor-demo -f compose.demo.yaml --env-file .env.demo build
#   docker compose -p court-monitor-demo -f compose.demo.yaml --env-file .env.demo up -d postgres
#   deploy/demo/snapshot.sh                # the copy of production, then migrations
#   docker compose -p court-monitor-demo -f compose.demo.yaml --env-file .env.demo up -d api
#
# The site is on 127.0.0.1:8003; nginx (deploy/demo/nginx.conf) puts it online.
name: court-monitor-demo

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host port: the copy is restored through `docker compose exec`.
    volumes:
      - demo_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: .
    # Not `court-monitor:local`: building the demo must not replace production's image.
    image: court-monitor-demo:local
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    working_dir: /app
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    image: court-monitor-demo:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8003:8000"
    # Only what the demo needs. No model key (OpenRouter, Anthropic, Together), no
    # Airtable: the copy is shown, never worked on.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEMO_READ_ONLY: "1"
      INVESTIGATION_TELEGRAM_CHANNELS: none
      JUNK_SCREEN: "0"
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --timeout-graceful-shutdown
      - "20"
      - --no-server-header
      # Behind nginx: the client's address and scheme come from its headers.
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  demo_postgres_data:
