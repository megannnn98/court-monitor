[project]
name = "court-core"
version = "0.1.0"
description = "Domain-free core of court-monitor: ingestion models, ports, generic retry, the JSON-chat wire protocol (ADR 0023)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_core"]
