[project]
name = "court-processing"
version = "0.1.0"
description = "Processing of court-monitor: extraction, entity groups (identity), roles, evidence, the junk screen, and the ER v2 path (persons)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "court-core",
    "court-ingestion",
    "court-platform",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pymorphy3>=2.0.6",
    "rapidfuzz>=3.14",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
# The junk screen's embedding mode (JUNK_SCREEN=1, ADR 0028): loaded lazily by
# `processing.junk.embedder`, so nothing else needs it installed.
semantic = [
    "sentence-transformers>=5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing", "src/persons"]

[tool.uv.sources]
court-core = { workspace = true }
court-ingestion = { workspace = true }
court-platform = { workspace = true }
