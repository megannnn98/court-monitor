[project]
name = "court-results"
version = "0.1.0"
description = "Results of court-monitor: findings, candidates, the dossier, queries, the operator's questions (ask)"
requires-python = ">=3.13"
dependencies = [
    "court-analysis",
    "court-platform",
    "court-processing",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pymorphy3>=2.0.6",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/results"]

[tool.uv.sources]
court-analysis = { workspace = true }
court-platform = { workspace = true }
court-processing = { workspace = true }
