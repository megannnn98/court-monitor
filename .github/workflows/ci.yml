name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature-*"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Generate API client
        run: npm run generate:api --prefix frontend
      - name: Check generated client is committed
        run: test -z "$(git status --porcelain -- frontend/openapi frontend/src/api/generated)"
      - name: Frontend tests and build
        run: npm run test --prefix frontend && npm run build --prefix frontend

  quality:
    name: quality (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Same as .python-version; makes the interpreter explicit in the log.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check packages apps tools tests scripts src

      # Every member's src/ and tests, the cross-module tests and scripts
      # (`[tool.mypy] files` in pyproject.toml).
      - name: Mypy
        run: uv run mypy --strict

  packages:
    # Each distribution's built wheel installed alone, with only what it declares (the
    # wheels of its workspace dependencies, their libraries from uv.lock): every file of
    # its src/ is in the wheel, every module it ships imports there (python -I, outside
    # the checkout) and its own tests pass. The development environment installs every member and cannot see an
    # undeclared import; this can. Then the production install the image makes.
    name: packages (each installed alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Each distribution alone
        run: uv run python scripts/check_package_isolation.py

      - name: The production install (the image's)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/production
        run: |
          uv sync --frozen --no-default-groups --package court-monitor
          cd "$RUNNER_TEMP"
          "$UV_PROJECT_ENVIRONMENT/bin/court-monitor" --help > /dev/null
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -c "import api, dagster_location.definitions"
          # Nothing in production depends on the evaluation tooling: it is not installed.
          if "$UV_PROJECT_ENVIRONMENT/bin/python" -I -c "import evaluation" 2>/dev/null; then
            echo "the production install has the evaluation tooling" >&2
            exit 1
          fi

  tests:
    name: tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Same as .python-version; makes the interpreter explicit in the log.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      # PostgreSQL tests skip without TEST_DATABASE_URL.
      - name: Pytest
        run: uv run pytest

  image:
    # The Dockerfile copies each member's manifest by name: a member it misses fails here.
    name: image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t court-monitor:ci .

      - name: Smoke
        run: |
          docker run --rm court-monitor:ci python -c "import api, dagster_location.definitions"
          docker run --rm court-monitor:ci court-monitor --help > /dev/null
          docker run --rm court-monitor:ci python apps/court-monitor/src/main.py validate-config > /dev/null
          # The code location as the image loads it; DAGSTER_HOME away from dagster.yaml, whose
          # storage needs the PostgreSQL settings of compose.yaml.
          docker run --rm -w /tmp -e DAGSTER_HOME=/tmp court-monitor:ci \
            dagster definitions validate -w /opt/dagster/dagster_home/workspace.yaml

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same image as compose.yaml: plain PostgreSQL 18.6. No migration needs an
        # extension that is not in it (ADR 0028).
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          # tests/conftest.py only allows a database named court_monitor_test.
          POSTGRES_DB: court_monitor_test
          POSTGRES_USER: court_monitor
          POSTGRES_PASSWORD: court_monitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court_monitor -d court_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql+psycopg://court_monitor:court_monitor_ci@localhost:5432/court_monitor_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Same as .python-version; makes the interpreter explicit in the log.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: uv run alembic upgrade head

      # Full suite with PostgreSQL. DATABASE_URL is intentionally not set; no Together AI
      # credentials; the `semantic` uv group is not installed, so no models are downloaded.
      - name: Pytest with PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: uv run pytest

  transition:
    # The migration that drops the vector tables and the extension (ADR 0028) can only be
    # tried where there is something to drop. `integration` runs on plain PostgreSQL and
    # skips those tests; this job runs them, and nothing else, on the image the working
    # databases were created with. It goes when no database of that kind is left.
    name: migration from pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: court_monitor_test
          POSTGRES_USER: court_monitor
          POSTGRES_PASSWORD: court_monitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court_monitor -d court_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql+psycopg://court_monitor:court_monitor_ci@localhost:5432/court_monitor_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: uv run alembic upgrade head

      # `-rs` prints why a test was skipped; here none of these may be.
      # `shell: bash` is what turns `pipefail` on: without it the step's result would be
      # `tee`'s, and a failing test would pass the job.
      - name: The removal, on a database that has what is removed
        shell: bash
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          uv run pytest tests/db/test_semantic_removal_migration.py -rs | tee transition.log
          ! grep -q "SKIPPED" transition.log
