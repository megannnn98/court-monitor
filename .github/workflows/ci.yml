# court-monitor CI
#
# Runs on every push and pull request:
#   1. lint + format check + type check + full test suite on Python 3.12 / 3.13 / 3.14
#   2. fast unit tests on Python 3.12 (parallel quick feedback)
#   3. Docker image build + smoke — only when image-relevant files change
#   4. Secret scanning with gitleaks
#
# No automatic production deploy — see docs/operations.md (to be added).

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra pg --dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -ra

  unit-tests:
    name: unit tests (py3.12, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra pg --dev

      - name: Pytest (unit only)
        run: uv run pytest tests/unit -ra

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    # Need the full history for accurate diff against the base.
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'alembic.ini'
              - 'docker-compose.yml'
              - 'docker/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'README.md'
              - 'src/**'
              - 'config/**'
              - 'migrations/**'
              - '.github/workflows/ci.yml'

  build-image:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t court-monitor:ci .
      - name: Smoke check (import + version)
        run: |
          docker run --rm --entrypoint sh court-monitor:ci -c "court-monitor --version || court-monitor --help"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
