name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature-*"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Generate API client
        run: npm run generate:api --prefix frontend
      - name: Check generated client is committed
        run: test -z "$(git status --porcelain -- frontend/openapi frontend/src/api/generated)"
      - name: Frontend tests and build
        run: npm run test --prefix frontend && npm run build --prefix frontend

  quality:
    name: quality (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Same as .python-version; makes the interpreter explicit in the log.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy --strict src tests

  tests:
    name: tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Same as .python-version; makes the interpreter explicit in the log.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      # PostgreSQL tests skip without TEST_DATABASE_URL.
      - name: Pytest
        run: uv run pytest

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same image as compose.yaml: PostgreSQL 18.6 with pgvector, which the applied
        # migrations still create (ADR 0018).
        image: pgvector/pgvector:pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          # tests/conftest.py only allows a database named court_monitor_test.
          POSTGRES_DB: court_monitor_test
          POSTGRES_USER: court_monitor
          POSTGRES_PASSWORD: court_monitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court_monitor -d court_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql+psycopg://court_monitor:court_monitor_ci@localhost:5432/court_monitor_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Same as .python-version; makes the interpreter explicit in the log.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: uv run alembic upgrade head

      # Full suite with PostgreSQL. DATABASE_URL is intentionally not set; no Together AI
      # credentials; the `semantic` uv group is not installed, so no models are downloaded.
      - name: Pytest with PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: uv run pytest
