# Profiles (ADR 0014):
#   (none)      PostgreSQL only — development and tests
#   monitoring  + Dagster webserver and daemon
#   api         + FastAPI (uvicorn)
#   production  everything above: postgres, api, dagster
#   migrate     one-shot `alembic upgrade head` (run explicitly, never by the API)
#
# Production-like start:
#   docker compose --profile production build
#   docker compose up -d postgres
#   docker compose run --rm migrate
#   docker compose --profile production up -d
services:
  postgres:
    # PostgreSQL 18.6 (the same build as postgres:18.6-bookworm) with pgvector 0.8.6,
    # pinned by digest: the pinned pgvector tags carry an older PostgreSQL 18 (ADR 0018).
    image: pgvector/pgvector:pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Explicit schema migration step (never run by API workers).
  migrate:
    build: .
    image: court-monitor:local
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    working_dir: /app
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    image: court-monitor:local
    restart: unless-stopped
    init: true
    profiles:
      - api
      - production
    # Private deployment (ADR 0014): bound to localhost; expose through a reverse
    # proxy with authentication and rate limiting if it ever leaves the host.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_MODEL: ${TOGETHER_MODEL:-}
      TOGETHER_TIMEOUT_SECONDS: ${TOGETHER_TIMEOUT_SECONDS:-30}
      # Entity names to the nominative (`collect-entities`): OpenRouter if its key is set,
      # else Claude; without a key the rules alone.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENTITY_NORMALIZE_MODEL: ${ENTITY_NORMALIZE_MODEL:-}
      # What one run of an entity step may spend on the model, in USD.
      ENTITY_MODEL_BUDGET_USD: ${ENTITY_MODEL_BUDGET_USD:-2}
      # The working date: step 2 deletes what was published before it.
      PIPELINE_SINCE: ${PIPELINE_SINCE:-2026-09-20}
      # Step 2 holds back junk that reads like a criminal case instead of deleting it
      # (docs/wiki/Junk-Screen.md). Needs the semantic image (compose.gpu.yaml); 0 turns it off.
      JUNK_SCREEN: ${JUNK_SCREEN:-1}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      # /health/ready reports a monitoring run older than this as stale.
      MONITORING_STALE_RUN_AFTER_MINUTES: ${MONITORING_STALE_RUN_AFTER_MINUTES:-120}
      ER_CANDIDATE_LIMIT: ${ER_CANDIDATE_LIMIT:-30}
      ER_AUTO_LINK_MIN_SCORE: ${ER_AUTO_LINK_MIN_SCORE:-0.85}
      ER_REVIEW_MIN_SCORE: ${ER_REVIEW_MIN_SCORE:-0.40}
      ER_MIN_MARGIN: ${ER_MIN_MARGIN:-0.10}
      # Airtable as the editing surface for the reference lists
      # (docs/wiki/Airtable-Sync.md). All six are required together and blank by
      # default: without them the «Справочники» page says so instead of failing, and
      # the rest of the pipeline never asks Airtable for anything. Only the API needs
      # them — a sync is a manual button there.
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_SOURCES_TABLE: ${AIRTABLE_SOURCES_TABLE:-}
      AIRTABLE_RFM_PERSONS_TABLE: ${AIRTABLE_RFM_PERSONS_TABLE:-}
      AIRTABLE_KNOWN_PERSONS_TABLE: ${AIRTABLE_KNOWN_PERSONS_TABLE:-}
      AIRTABLE_EXCLUDED_PERSONS_TABLE: ${AIRTABLE_EXCLUDED_PERSONS_TABLE:-}
      # One sync of the Rosfinmonitoring list is ~140 pages of 100 records, against
      # Airtable's limit of 5 requests a second.
      AIRTABLE_TIMEOUT_SECONDS: ${AIRTABLE_TIMEOUT_SECONDS:-120}
      # Where the operator drops the CSVs exported from Airtable when the base is only
      # readable in a browser (file import mode, docs/wiki/Airtable-Sync.md). A directory
      # in the repository, bind-mounted: without a mount the container would look at an
      # empty path and the operator's files would never be seen.
      AIRTABLE_IMPORT_DIR: ${AIRTABLE_IMPORT_DIR:-/import}
    volumes:
      - ./airtable-import:/import
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --timeout-graceful-shutdown
      - "20"
      - --no-server-header
    stop_grace_period: 30s
    healthcheck:
      # Liveness only: a database outage shows in /health/ready, it must not
      # make the orchestrator restart a healthy process.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Automated monitoring (ADR 0013): docker compose --profile monitoring up -d
  # Apply domain migrations first: docker compose run --rm migrate
  # Dagster metadata goes to its own database (DAGSTER_PG_DB), created here if missing.
  dagster-db-init:
    image: postgres:18.6-bookworm
    profiles:
      - monitoring
      - production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-court_monitor_dagster}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$${DAGSTER_PG_DB}'" | grep -q 1
        || psql -c "CREATE DATABASE \"$${DAGSTER_PG_DB}\""

  dagster-webserver:
    build: .
    image: court-monitor:local
    restart: unless-stopped
    init: true
    profiles:
      - monitoring
      - production
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    ports:
      - "127.0.0.1:3000:3000"
    environment: &monitoring-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USERNAME: ${POSTGRES_USER}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-court_monitor_dagster}
      MONITORING_ENABLED_SOURCES: ${MONITORING_ENABLED_SOURCES:-}
      MONITORING_CRON: ${MONITORING_CRON:-0 * * * *}
      MONITORING_DISCOVERY_LIMIT: ${MONITORING_DISCOVERY_LIMIT:-50}
      MONITORING_STALE_RUN_AFTER_MINUTES: ${MONITORING_STALE_RUN_AFTER_MINUTES:-120}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      ER_CANDIDATE_LIMIT: ${ER_CANDIDATE_LIMIT:-30}
      ER_AUTO_LINK_MIN_SCORE: ${ER_AUTO_LINK_MIN_SCORE:-0.85}
      ER_REVIEW_MIN_SCORE: ${ER_REVIEW_MIN_SCORE:-0.40}
      ER_MIN_MARGIN: ${ER_MIN_MARGIN:-0.10}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully

  dagster-daemon:
    image: court-monitor:local
    restart: unless-stopped
    init: true
    profiles:
      - monitoring
      - production
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment: *monitoring-environment
    # Run workers are daemon subprocesses; tini forwards SIGTERM to the daemon
    # only, so a run killed on stop is aborted as stale by the next run (ADR 0014).
    stop_grace_period: 60s
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully
      dagster-webserver:
        condition: service_started

volumes:
  postgres_data:
