# Profiles (ADR 0014):
#   (none)      PostgreSQL only — development and tests
#   semantic    + Qdrant (derived semantic index)
#   monitoring  + Dagster webserver and daemon
#   api         + FastAPI (uvicorn)
#   production  everything above: postgres, qdrant, api, dagster
#   migrate     one-shot `alembic upgrade head` (run explicitly, never by the API)
#
# Production-like start:
#   docker compose --profile production build
#   docker compose up -d postgres
#   docker compose run --rm migrate
#   docker compose --profile production up -d
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional semantic entity retrieval (ADR 0011): candidate index only,
  # PostgreSQL stays the source of truth. docker compose --profile semantic up -d
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    profiles:
      - semantic
      - production

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      # The image has no curl/wget; bash can open the HTTP port directly.
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Explicit schema migration step (never run by API workers).
  migrate:
    build: .
    image: court-monitor:local
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    working_dir: /app
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    image: court-monitor:local
    restart: unless-stopped
    init: true
    profiles:
      - api
      - production
    # Private deployment (ADR 0014): bound to localhost; expose through a reverse
    # proxy with authentication and rate limiting if it ever leaves the host.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: ${API_QDRANT_URL:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_MODEL: ${TOGETHER_MODEL:-}
      TOGETHER_TIMEOUT_SECONDS: ${TOGETHER_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      # /health/ready reports a monitoring run older than this as stale.
      MONITORING_STALE_RUN_AFTER_MINUTES: ${MONITORING_STALE_RUN_AFTER_MINUTES:-120}
      ER_CANDIDATE_LIMIT: ${ER_CANDIDATE_LIMIT:-30}
      ER_AUTO_LINK_MIN_SCORE: ${ER_AUTO_LINK_MIN_SCORE:-0.85}
      ER_REVIEW_MIN_SCORE: ${ER_REVIEW_MIN_SCORE:-0.40}
      ER_MIN_MARGIN: ${ER_MIN_MARGIN:-0.10}
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --timeout-graceful-shutdown
      - "20"
      - --no-server-header
    stop_grace_period: 30s
    healthcheck:
      # Liveness only: a database outage shows in /health/ready, it must not
      # make the orchestrator restart a healthy process.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Automated monitoring (ADR 0013): docker compose --profile monitoring up -d
  # Apply domain migrations first: docker compose run --rm migrate
  # Dagster metadata goes to its own database (DAGSTER_PG_DB), created here if missing.
  dagster-db-init:
    image: postgres:18.6-bookworm
    profiles:
      - monitoring
      - production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-court_monitor_dagster}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$${DAGSTER_PG_DB}'" | grep -q 1
        || psql -c "CREATE DATABASE \"$${DAGSTER_PG_DB}\""

  dagster-webserver:
    build: .
    image: court-monitor:local
    restart: unless-stopped
    init: true
    profiles:
      - monitoring
      - production
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    ports:
      - "127.0.0.1:3000:3000"
    environment: &monitoring-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_USERNAME: ${POSTGRES_USER}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-court_monitor_dagster}
      # Empty: semantic stage reports not_configured. With --profile semantic and an
      # image built with INSTALL_SEMANTIC=1, set MONITORING_QDRANT_URL=http://qdrant:6333.
      QDRANT_URL: ${MONITORING_QDRANT_URL:-}
      MONITORING_ENABLED_SOURCES: ${MONITORING_ENABLED_SOURCES:-ovd-info,sota-vision}
      MONITORING_CRON: ${MONITORING_CRON:-0 * * * *}
      MONITORING_DISCOVERY_LIMIT: ${MONITORING_DISCOVERY_LIMIT:-50}
      MONITORING_STALE_RUN_AFTER_MINUTES: ${MONITORING_STALE_RUN_AFTER_MINUTES:-120}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      ER_CANDIDATE_LIMIT: ${ER_CANDIDATE_LIMIT:-30}
      ER_AUTO_LINK_MIN_SCORE: ${ER_AUTO_LINK_MIN_SCORE:-0.85}
      ER_REVIEW_MIN_SCORE: ${ER_REVIEW_MIN_SCORE:-0.40}
      ER_MIN_MARGIN: ${ER_MIN_MARGIN:-0.10}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully

  dagster-daemon:
    image: court-monitor:local
    restart: unless-stopped
    init: true
    profiles:
      - monitoring
      - production
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment: *monitoring-environment
    # Monitoring run workers get SIGTERM and finish their run as failed; a
    # killed run is aborted as stale by the next run (ADR 0013).
    stop_grace_period: 60s
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully
      dagster-webserver:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
