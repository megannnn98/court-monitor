[project]
name = "court-monitor-recovered"
version = "0.1.0"
description = "Recovered first vertical slice of court-monitor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "dagster>=1.13.22",
    "dagster-postgres>=0.29.22",
    "dagster-webserver>=1.13.22",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "psycopg2>=2.9.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11.0",
    "pymorphy3>=2.0.6",
    "qdrant-client>=1.15",
    "rapidfuzz>=3.14",
    "selectolax>=0.3.29",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.32.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
mcp = [
    "mcp>=2.2.0",
]
semantic = [
    "sentence-transformers>=5.0",
]

[tool.uv]
# Development installs the MCP adapter too (type checks and tests cover it);
# deployment images use --no-default-groups, so API, CLI and Dagster never need it.
default-groups = ["dev", "mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
markers = [
    "live_together: calls the real Together AI API; opt-in via TOGETHER_LIVE_TESTS=1 or LIVE_LLM_TESTS=1",
    "qdrant: needs a running Qdrant service; opt-in via QDRANT_TEST_URL",
    "semantic_models: loads real embedding/reranker models; opt-in via SEMANTIC_MODEL_TESTS=1",
]

[[tool.mypy.overrides]]
# Morphological dictionary for personal names; ships no type information.
module = ["pymorphy3", "pymorphy3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `semantic` uv group; imported lazily. CI quality runs without it.
module = ["sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
ignore_missing_imports = true
