# The court-monitor workspace (docs/architecture/package-map.md). The root is not a
# package: it names the members, the tools every member is checked with, and one
# configuration of ruff, mypy and pytest for all of them.
#
#   packages/*   the modules: court-core, court-platform, court-ingestion,
#                court-processing, court-analysis, court-results, court-investigation,
#                court-orchestrator
#   apps/*       court-monitor: the composition root, CLI, API, Dagster's code location
#   tools/*      court-evaluation: measurements; nothing in production depends on it
#
# `uv sync` installs every member (the `dev` group) for development and the tests. An
# image installs the application alone: `uv sync --package court-monitor
# --no-default-groups`.

[tool.uv.workspace]
members = ["packages/*", "apps/*", "tools/*"]

[dependency-groups]
dev = [
    "court-evaluation",
    "court-monitor",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-openpyxl>=3.1.5.20260827",
]
semantic = [
    "court-evaluation[semantic]",
    "court-monitor[semantic]",
]

[tool.uv]
# Deployment images use --no-default-groups, so API, CLI and Dagster never need dev tools.
default-groups = ["dev"]

[tool.uv.sources]
court-evaluation = { workspace = true }
court-monitor = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
# One configuration for the whole workspace. First-party code is every distribution's
# `src/` (import sorting reads it).
src = [".", "packages/*/src", "apps/*/src", "tools/*/src"]

[tool.pytest.ini_options]
# The workspace's code is imported as installed packages (`uv sync`), never from a path:
# only the tests' own helpers (`support`) are put on it.
pythonpath = ["tests"]
# The cross-module tests, and each distribution's own (they need nothing of `tests/`).
testpaths = ["tests", "packages/*/tests"]
# Diagnostic: a test stuck this long prints every thread's stack (CI hang on PR #64).
faulthandler_timeout = 240

[tool.mypy]
# Every member's `src/` and the tests: `uv run mypy --strict`.
files = [
    "packages/*/src",
    "packages/*/tests",
    "apps/*/src",
    "tools/*/src",
    "tests",
    "scripts",
]

[[tool.mypy.overrides]]
# Morphological dictionary for personal names; ships no type information.
module = ["pymorphy3", "pymorphy3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The optional `semantic` extra (court-processing, court-evaluation); imported lazily.
# CI quality runs without it.
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    # The junk screen's measurements (`evaluation.junk_screen`) come with the group.
    "numpy",
    "numpy.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyArrow ships no type information; reading the ОВД-Инфо copy of the list stays
# runtime-checked.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# WeasyPrint does not ship type stubs either; it prints the wiki to PDF.
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true
