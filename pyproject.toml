[project]
name = "court-monitor-recovered"
version = "0.1.0"
description = "Recovered first vertical slice of court-monitor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11.0",
    "qdrant-client>=1.19.0",
    "selectolax>=0.3.29",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0,<3.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
